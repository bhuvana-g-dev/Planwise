services:
  - type: web
    name: planwise-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Render's disk is ephemeral (wiped on deploy/restart/sleep), so events
      # must live in Firestore, not the local JSON file.
      - key: PERSISTENCE
        value: firestore
      # The Firebase *Project ID* (Project settings > General), not the name.
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Upload the service-account key as a Render Secret File named
      # serviceAccount.json; Render mounts it at this path.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/serviceAccount.json
      - key: REQUIRE_AUTH
        value: "false"
